<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MP Micropréstamos</title>
<style>
  :root{--mp-azul:#02265E;--mp-gris-100:#F4F6FA;--mp-gris-200:#E3E8F0;--mp-gris-600:#5B6472;--mp-texto:#16213A;--mp-blanco:#FFFFFF;--mp-radius-lg:16px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--mp-gris-100);color:var(--mp-texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{background:var(--mp-azul);padding:14px 16px}
  header img{height:40px;width:auto;background:var(--mp-blanco);border-radius:6px;padding:4px 8px;display:block}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{background:var(--mp-blanco);border-radius:var(--mp-radius-lg);padding:32px 24px;max-width:480px;width:100%;box-shadow:0 1px 2px rgba(2,38,94,.06)}
  h1{font-size:1.375rem;line-height:1.2;color:var(--mp-azul);margin:0 0 12px}
  p{margin:0 0 8px}
  .muted{color:var(--mp-gris-600);font-size:.875rem}
  footer{padding:16px;text-align:center;color:var(--mp-gris-600);font-size:.75rem}
</style>
</head>
<body>
<header><img src="/mp-logo.png" alt="MP Micropréstamos"></header>
<main>
  <section class="card" aria-labelledby="t">
    <h1 id="t">Estamos preparando la nueva plataforma de micropréstamos</h1>
    <p>Por el momento este sitio no está disponible.</p>
    <p class="muted">Vuelve a intentarlo en unos minutos.</p>
  </section>
</main>
<footer>Un producto de Financiera Isthmus Capital · Panamá</footer>
</body>
</html>
