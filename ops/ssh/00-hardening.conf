# Brief 01 — hardening SSH, FASE 1 (02-oct-2026). Se lee antes que 50-cloud-init.conf (gana el primer valor).
# Cierra contraseñas y teclado interactivo; root sigue entrando SOLO por llave.
# FASE 2 (pendiente, plan Task 3b): añadir "PermitRootLogin no" y "AllowUsers deploy" cuando deploy
# opere Cotizador (/opt/cotizador-isthmus) y Max Motors (/home/maxmotors), hoy root:root.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
